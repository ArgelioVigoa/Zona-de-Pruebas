name: Deploy QuoLab Nexus

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Assemble interactive main site
        run: |
          set -euo pipefail
          test -s index.html
          test -s quolab-nexus-gate-designer.html
          test -s quolab-nexus-data-analyzer.html
          rm -rf dist
          mkdir -p dist
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.zip' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            ./ dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/quolab-nexus-gate-designer.html
          test -s dist/quolab-nexus-data-analyzer.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
